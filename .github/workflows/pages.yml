name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the data files are valid
        run: |
          python3 - <<'CHECK'
          import json, pathlib, sys

          stores = json.load(open('data/stores.json'))['stores']
          index = json.load(open('data/routes-index.json'))['routes']
          files = {p.stem for p in pathlib.Path('data/routes').glob('*.json')}
          print(f"{len(stores)} stores, {len(index)} routed, {len(files)} route files")

          # Every routed store must have the detail file the app fetches when
          # you open it, or the store opens to a spinner that never resolves.
          missing = sorted(set(index) - files)
          if missing:
              sys.exit(f"route files missing for: {', '.join(missing[:10])}")

          for key, entry in index.items():
              for profile in ('balanced', 'quiet'):
                  if profile not in entry:
                      sys.exit(f"{key}: no {profile} route")
          CHECK

      # enablement only takes effect with a token that can administer the repo
      # (a PAT with `repo`, or an App with `administration:write`). The default
      # GITHUB_TOKEN may publish to Pages but not create the Pages site, so with
      # Pages still off this fails with "Resource not accessible by integration"
      # and someone has to switch it on once under Settings -> Pages. It is left
      # on so the run says plainly which step is missing, and so a fork that does
      # supply such a token sets itself up.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v5

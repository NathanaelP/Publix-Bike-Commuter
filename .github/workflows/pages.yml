name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the data files are valid
        run: |
          python3 -c "import json; d=json.load(open('data/stores.json')); \
            print(len(d['stores']), 'stores')"
          python3 -c "import json; d=json.load(open('data/routes.json')); \
            print(len(d['routes']), 'routes')"

      # enablement only takes effect with a token that can administer the repo
      # (a PAT with `repo`, or an App with `administration:write`). The default
      # GITHUB_TOKEN may publish to Pages but not create the Pages site, so with
      # Pages still off this fails with "Resource not accessible by integration"
      # and someone has to switch it on once under Settings -> Pages. It is left
      # on so the run says plainly which step is missing, and so a fork that does
      # supply such a token sets itself up.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v5
